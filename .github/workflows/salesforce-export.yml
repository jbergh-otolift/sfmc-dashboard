name: Salesforce report export

on:
  schedule:
    - cron: "0 6 * * *"   # dagelijks 06:00 UTC — pas aan naar wens
  workflow_dispatch: {}    # handmatig triggeren via de Actions tab

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python scripts/export_salesforce_report.py
        env:
          SF_DOMAIN: ${{ secrets.SF_DOMAIN }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_REPORT_ID: ${{ secrets.SF_REPORT_ID }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/report.csv
          git diff --staged --quiet || git commit -m "Update Salesforce report export"
          git push
